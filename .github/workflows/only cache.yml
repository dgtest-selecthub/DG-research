name: Create test cache

on:
  push:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Create sample file
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path cache-dir | Out-Null
          Set-Content -Path cache-dir/cached.txt -Value "Cache only from DG-research"

      - name: Create cache
        uses: actions/cache@v4
        with:
          path: cache-dir
          key: test-cache-only-${{ github.run_id }}
