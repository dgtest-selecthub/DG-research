name: Long running test

on:
  workflow_dispatch:

concurrency:
  group: long-running-test
  cancel-in-progress: false

jobs:
  hold:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Wait 10 minutes
        shell: pwsh
        run: |
          Write-Host "Waiting 10 minutes so the run can be cancelled..."
          Start-Sleep -Seconds 600
