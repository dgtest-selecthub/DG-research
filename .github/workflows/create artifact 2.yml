name: Create test artifact 2

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Create a sample file
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path output | Out-Null
          Set-Content -Path output/sample2.txt -Value "Second artifact from DG-research"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: test-artifact-2
          path: output/
          retention-days: 1
