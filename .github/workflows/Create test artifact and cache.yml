name: Create test artifact and cache

on:
  push:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Create sample files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path output | Out-Null
          Set-Content -Path output/sample3.txt -Value "Artifact from DG-research"
          New-Item -ItemType Directory -Force -Path cache-dir | Out-Null
          Set-Content -Path cache-dir/cached.txt -Value "Cache from DG-research"

      - name: Create cache
        uses: actions/cache@v4
        with:
          path: cache-dir
          key: test-cache-${{ github.run_id }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: test-artifact-3
          path: output/
          retention-days: 80
