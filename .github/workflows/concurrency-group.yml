name: Create test concurrency group

on:
  push:

concurrency:
  group: test-concurrency-group
  cancel-in-progress: false

jobs:
  hold:
    runs-on: windows-latest
    steps:
      - name: Hold the concurrency group open
        shell: pwsh
        run: |
          Write-Host "Holding concurrency group for 10 minutes..."
          Start-Sleep -Seconds 6000
